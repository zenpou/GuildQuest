# GitHub Pages へ dist/ を配置する。main と review/** への push、または手動実行で動く。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'review/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配置の途中打ち切りは旧版と新版のファイルが混ざる原因になるため、順番待ちにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
